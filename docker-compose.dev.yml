# Local development: Postgres only. api (pnpm --filter @vaultkeeper/api dev) and web (vite) run on the host.
# Usage: docker compose -f docker-compose.dev.yml up -d --wait
name: vaultkeeper-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vaultkeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaultkeeper}
      POSTGRES_DB: ${POSTGRES_DB:-vaultkeeper}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
